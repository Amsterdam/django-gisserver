[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-gisserver"
description = "Django speaking WFS 2.0 (exposing GeoDjango model fields)"
readme = "README.md"
license = "MPL-2.0"
authors = [
    { name = "Diederik van der Boor", email = "opensource@edoburu.nl" },
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Django >= 4.2",
    "defusedxml >= 0.7.1",
    "lru_dict >= 1.4.1",
    "orjson >= 3.11.5",
    "pyproj >= 3.7.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/amsterdam/django-gisserver"
Repository = "https://github.com/amsterdam/django-gisserver"

[project.optional-dependencies]
tests = [
    "django-environ >= 0.12.0",
    "psycopg2-binary >= 2.9.11",
    "lxml >= 6.0.2",
    "pytest >= 9.0.2",
    "pytest-django >= 4.11.1",
    "pytest-cov >= 7.0.0",
]
docs = [
    "Django ~= 5.2",
    "sphinxcontrib-django >= 2.5",
    "myst-parser >= 4.0.1",
    "psycopg2-binary >= 2.9.11",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "gisserver.__version__" }

[tool.setuptools.packages.find]
include = ["gisserver*"]
exclude = ["tests*", "example*"]

# ==== pytest ====
[tool.pytest.ini_options]
xfail_strict = true
minversion = "6.0"
django_find_project = false
pythonpath = "."
testpaths = ["tests"]
addopts = [
    "--nomigrations",
    "--reuse-db",
    "--ds=tests.settings",
    "--strict-markers"
]

# ==== Coverage ====
[tool.coverage.run]
branch = true
source = ["gisserver"]
omit = ["*/migrations/*.py", "*/test*.py", "*/tests/*"]
plugins = ["django_coverage_plugin"]


# ==== black ====
[tool.black]
line-length = 99
target-version = ["py39"]

# ==== ruff ====
[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C90", # mccabe
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RET", # flake8-return (partially)
    # "PT",  # flake8-pytest-style
    # "TCH",  # flake8-type-checking (moves import to `if typing.TYPE_CHECKING`)
    # "ERA",  # eradicate (commented out code)
    # "TRY",  # tryceratops
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "INT", # flake8-gettext
    "FLY", # flynt (fixes unneeded static string joins)
    "UP", # pyupgrade
    "S", # security (bugbear)
    "RUF010", # ruff: fix f"{str(..)}" usage
    "RUF013", # ruff: fix annotations for =None arguments
]
ignore = [
    "S311", # allow random.randint()
    "DJ001", # allow models.CharField(null=True)
    "SIM105", # enforcing contextlib.suppress() instead of try..catch
    "RET501", # unnecessary-return-none
    "RET505", # superfluous-else-return
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    # Ideally fixed later:
    "E501", # line too long (=comments/long strings)
    "S101", # assert statement
    "S607", # subprocess partial path
    "BLE001", # blind "except Exception"
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = ["gettext_lazy", "ngettext_lazy", "pgettext", "pgettext_lazy", "npgettext", "npgettext_lazy"]

[tool.ruff.lint.isort]
known-first-party = ["gisserver"]
#required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]  # line too long
"docs/_ext/djangodummy/settings.py" = ["S105"]  # allow hardcoded SECRET_KEY
"tests/**/*.py" = ["S101", "S105", "S106", "S314", "S320", "S608"]  # allow asserts, hardcoded passwords, lxml parsing, SQL variables

[tool.ty.rules]
all = "warn"

[tool.ty.terminal]
error-on-warning = false
