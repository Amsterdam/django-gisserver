[project]
name = "django-gisserver"
version = "2.6.0"
description = "Django speaking WFS 2.0 (exposing GeoDjango model fields)"
readme = "README.md"
license = "MPL-2.0"
authors = [
    { name = "Team Data Diensten, van het Dataplatform onder de Directie Digitale Voorzieningen (Gemeente Amsterdam)", email = "datapunt@amsterdam.nl" },
]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Django >= 5.2",
    "defusedxml >= 0.7.1",
    "lru_dict >= 1.4.1",
    "orjson >= 3.11.5",
    "pyproj >= 3.7.1",
]

[dependency-groups]
tests = [
    "django-environ >= 0.14.0",
    "django-coverage-plugin >= 3.2.2",
    "psycopg2-binary >= 2.9.11",
    "lxml >= 6.0.2",
    "pytest >= 9.1.1",
    "pytest-django >= 4.14.0",
    "pytest-cov >= 7.1.0",
    "ruff==0.17.2",
    "ty==0.0.92",
    "codecov==2.1.13",
]
docs = [
    "Django >= 5.2",
    "sphinxcontrib-django >= 2.5",
    "myst-parser >= 4.0.1",
    "psycopg2-binary >= 2.9.11",
]

[project.urls]
Homepage = "https://github.com/amsterdam/django-gisserver"
Repository = "https://github.com/amsterdam/django-gisserver"

[build-system]
requires = ["uv_build>=0.11.21,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gisserver"
module-root = ""

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "9.0"
django_find_project = false
pythonpath = "./"
testpaths = ["tests"]
addopts = [
    "--doctest-modules",
    "--nomigrations",
    "--reuse-db",
    "--cov=gisserver",
    "--cov-fail-under=80",
    "--ds=tests.settings",
]
norecursedirs = ["node_modules", ".tox", ".git", "dist", "build", "venv", ".venv"]
filterwarnings = [
    "once::DeprecationWarning",
    "once::PendingDeprecationWarning",
    "ignore:Model '.*' was already registered. Reloading models is not advised.*:RuntimeWarning",
    'ignore:DateTimeField .* received a naive datetime .* while time zone support is active\.:RuntimeWarning:django\.db\.models\.fields',
]

# ==== Coverage ====
[tool.coverage.run]
branch = true
source = ["gisserver"]
omit = ["*/migrations/*.py", "*/test*.py"]
relative_files = true
plugins = ["django_coverage_plugin"]

# ==== ruff ====
[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C90", # mccabe
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RET", # flake8-return (partially)
    # "PT",  # flake8-pytest-style
    # "TCH",  # flake8-type-checking (moves import to `if typing.TYPE_CHECKING`)
    # "ERA",  # eradicate (commented out code)
    # "TRY",  # tryceratops
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "INT", # flake8-gettext
    "FLY", # flynt (fixes unneeded static string joins)
    "UP", # pyupgrade
    "S", # security (bugbear)
    "RUF010", # ruff: fix f"{str(..)}" usage
    "RUF013", # ruff: fix annotations for =None arguments
]
ignore = [
    "S311", # allow random.randint()
    "DJ001", # allow models.CharField(null=True)
    "SIM105", # enforcing contextlib.suppress() instead of try..catch
    "RET501", # unnecessary-return-none
    "RET505", # superfluous-else-return
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    # Ideally fixed later:
    "E501", # line too long (=comments/long strings)
    "S101", # assert statement
    "S607", # subprocess partial path
    "BLE001", # blind "except Exception"
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = ["gettext_lazy", "ngettext_lazy", "pgettext", "pgettext_lazy", "npgettext", "npgettext_lazy"]

[tool.ruff.lint.isort]
known-first-party = ["gisserver"]
#required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]  # line too long
"docs/_ext/djangodummy/settings.py" = ["S105"]  # allow hardcoded SECRET_KEY
"tests/**/*.py" = ["S101", "S105", "S106", "S314", "S320", "S608"]  # allow asserts, hardcoded passwords, lxml parsing, SQL variables

[tool.ty.rules]
all = "warn"

[tool.ty.terminal]
error-on-warning = false
