name: CI Testing
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  run_tests:
    name: "Django ${{ matrix.django }} on Python ${{ matrix.python }}"
    runs-on: ubuntu-24.04  # Noble LTS

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: test_gisserver
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      # max-parallel: 8  # default is max available
      fail-fast: false
      matrix:
        include:
          # Django 5.2
          - django: "5.2"
            python: "3.11"
          - django: "5.2"
            python: "3.12"
          - django: "5.2"
            python: "3.13"
          - django: "5.2"
            python: "3.14"
          # Django 6.0
          - django: "6.0"
            python: "3.12"
          - django: "6.0"
            python: "3.13"
          - django: "6.0"
            python: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install GeoDjango dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext libgdal34t64

      - name: Install Python Packages
        run: uv sync --locked --group tests --python ${{ matrix.python }}

      - name: Cache schemas.opengis.net
        uses: actions/cache@v4
        with:
          key: "schemas.opengis.net"
          path: "tests/files/xsd/"

      - name: Run Tests
        run: |
          echo "Python ${{ matrix.python }} / Django ${{ matrix.django }}"
          GISSERVER_USE_DB_RENDERING=1 uv run --with "Django==${{ matrix.django }}.*" pytest
          GISSERVER_USE_DB_RENDERING=0 uv run --with "Django==${{ matrix.django }}.*" pytest
        env:
          PGUSER: postgres
          PGPASSWORD: password
        continue-on-error: ${{ contains(matrix.django, 'b') }}
